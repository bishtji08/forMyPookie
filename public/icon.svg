<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A6D" />
      <stop offset="55%" stop-color="#FF527B" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE4EC" />
    </linearGradient>

    <filter id="heartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5B0525" flood-opacity="0.38" />
    </filter>

    <filter id="sparkleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FFD166" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Modern App Icon Rounded Squircle Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Subtle Rim Light / Inner Border -->
  <rect width="508" height="508" x="2" y="2" rx="118" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.25" />

  <!-- Romantic Heart Emblem -->
  <g filter="url(#heartShadow)">
    <path
      d="M256 432 C240 416 112 305 112 192 C112 126 166 76 232 76 C248 76 256 88 256 88 C256 88 264 76 280 76 C346 76 400 126 400 192 C400 305 272 416 256 432 Z"
      fill="url(#heartGrad)"
    />

    <!-- Glossy Highlight Curve -->
    <path
      d="M165 116 C136 142 132 182 136 214 C132 172 156 132 196 118 C185 116 174 116 165 116 Z"
      fill="#FFFFFF"
      opacity="0.75"
    />
  </g>

  <!-- Sparkles ✨ -->
  <g filter="url(#sparkleGlow)">
    <!-- Big Sparkle Top Right -->
    <path
      d="M 376,100 Q 376,128 404,128 Q 376,128 376,156 Q 376,128 348,128 Q 376,128 376,100 Z"
      fill="#FFD166"
    />
    <!-- Sparkle Dot -->
    <circle cx="334" cy="92" r="7" fill="#FFF275" />

    <!-- Small Sparkle Bottom Left -->
    <path
      d="M 120,320 Q 120,336 136,336 Q 120,336 120,352 Q 120,336 104,336 Q 120,336 120,320 Z"
      fill="#FFD166"
    />
  </g>
</svg>
